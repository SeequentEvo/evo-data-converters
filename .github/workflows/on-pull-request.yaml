name: Tests and Linting

on:
  pull_request:

permissions:
  contents: read

jobs:
  run-pre-commit:
    name: Run pre commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.1

  run-linting:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linting

  converter-capabilities:
    name: Converter capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-uv
        with:
          PYTHON_VERSION: "3.10"

      - name: Validate converter-capabilities.json files
        run: uv run --project packages/common python -m scripts.manage_converter_capabilities validate

      - name: Render converter capabilities docs
        run: uv run --project packages/common python -m scripts.render_converter_capabilities

      - name: Fail if generated docs/converter-capabilities.md or .json are out of date
        run: git diff --exit-code -- docs/converter-capabilities.md docs/converter-capabilities.json

  run-tests:
    uses: ./.github/workflows/run-all-tests.yaml
