name: Run tests on all packages

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  run-tests:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        package:
          - common
          - gocad
          - image
          - obj
          - omf
          - resqml
          - ubc
          - vtk
        exclude:
          # resqpy 5.1.10 requires NumPy 1.x, which has no Python 3.13+ wheels.
          - package: resqml
            python-version: "3.13"
          - package: resqml
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/testing
        with:
          PACKAGE: ${{ matrix.package }}
          PYTHON_VERSION: ${{ matrix.python-version }}
