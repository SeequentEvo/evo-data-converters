[project]
name = "evo-data-converters-ags"
description = "Python data converters for AGS to Evo geoscience objects"
version = "0.1.0"
requires-python = ">=3.11"
license-files = ["LICENSE.md"]
dynamic = ["readme"]
authors = [
    { name = "Seequent", email = "support@seequent.com" }
]
dependencies = [
    "evo-data-converters-common>=0.5.1",
    "evo-objects[utils]>=0.6.6",
    "evo-sdk-common>=0.5.31",
    "python-ags4==1.1.0",
]

[project.urls]
Source = "https://github.com/SeequentEvo/evo-data-converters"
Tracker = "https://github.com/SeequentEvo/evo-data-converters/issues"
Homepage = "https://www.seequent.com/"
Documentation = "https://developer.seequent.com/"

[dependency-groups]
dev = [
    "pytest",
    "requests-mock",
]

[project.optional-dependencies]
"notebooks" = [
    "evo-sdk-common[notebooks]",
    "notebook>=7.4.3",
]

[tool.uv.sources]
evo-data-converters-common = { path = "../common", editable = true }

[tool.ruff]
src = ["src", "tests"]
line-length = 120
[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/evo"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Literal TOML strings (single quotes) need no escaping of backslashes.
# Converts relative links to absolute links in PyPI
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/SeequentEvo/evo-data-converters/tree/main/packages/ags/\g<2>)'

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP006"]
