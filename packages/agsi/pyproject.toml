[project]
name = "evo-data-converters-agsi"
version = "0.0.1"
description = "Python data converters for AGSI files to Evo geoscience objects."
readme = "README.md"
authors = [
    { name = "Seequent", email = "support@seequent.com" }
]
requires-python = ">=3.10"
dependencies = [
    "evo-data-converters-common",
    # 2026.9.9 is the first release known to ship GeologicalSections_V1_2_0.
    "evo-schemas>=2026.9.9",
    "ezdxf>=1.3.0",
    "numpy>=1.26.3",
    "pyarrow>=21.0.0",
    "pydantic>=2.7",
    "shapely>=2.0.4",
]

[project.urls]
Source = "https://github.com/SeequentEvo/evo-data-converters"
Tracker = "https://github.com/SeequentEvo/evo-data-converters/issues"
Homepage = "https://www.seequent.com/"
Documentation = "https://developer.seequent.com/"

[dependency-groups]
dev = [
    "pytest"
]

[project.scripts]
evo-data-converters-agsi = "evo_data_converters_agsi:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/evo"]

[tool.uv.sources]
evo-data-converters-common = { path = "../common", editable = true }

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Literal TOML strings (single quotes) need no escaping of backslashes.
# Converts relative links to absolute links in PyPI
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/SeequentEvo/evo-data-converters/tree/main/packages/agsi/\g<2>)'
