[project]
name = "evo-data-converters-common"
description = "Python framework for building data converters between common geoscience data formats"
version = "0.3.4"
requires-python = ">=3.10"
license-files = ["LICENSE.md"]
dynamic = ["readme"]
authors = [{ name = "Seequent", email = "support@seequent.com" }]

dependencies = [
    "aiohttp",
    "evo-sdk-common>=0.4.2",
    "evo-objects>=0.3.0",
    "evo-schemas>=2025.9.12",
    "nest_asyncio",
    "numpy>=1.26.3",
    "pyarrow",
    "requests",
    "scipy",
    "pyproj>=3.7.1",
]

[project.urls]
Source = "https://github.com/SeequentEvo/evo-data-converters"
Tracker = "https://github.com/SeequentEvo/evo-data-converters/issues"
Homepage = "https://www.seequent.com/"
Documentation = "https://developer.seequent.com/"

# Developer task entry points, run from packages/common with `uv run <name>`
# (e.g. `uv run lint`, `uv run test-xyz`). Backed by evo.data_converters.common._dev_tasks.
[project.scripts]
lint = "evo.data_converters.common._dev_tasks:lint"
lint-fix = "evo.data_converters.common._dev_tasks:lint_fix"
create-converter = "evo.data_converters.common._dev_tasks:create_converter"
test = "evo.data_converters.common._dev_tasks:test_all"
test-common = "evo.data_converters.common._dev_tasks:test_package"
test-duf = "evo.data_converters.common._dev_tasks:test_package"
test-gocad = "evo.data_converters.common._dev_tasks:test_package"
test-image = "evo.data_converters.common._dev_tasks:test_package"
test-obj = "evo.data_converters.common._dev_tasks:test_package"
test-omf = "evo.data_converters.common._dev_tasks:test_package"
test-resqml = "evo.data_converters.common._dev_tasks:test_package"
test-shp = "evo.data_converters.common._dev_tasks:test_package"
test-ubc = "evo.data_converters.common._dev_tasks:test_package"
test-vtk = "evo.data_converters.common._dev_tasks:test_package"
test-xyz = "evo.data_converters.common._dev_tasks:test_package"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff==0.9.1",    # keep in sync with .pre-commit-config.yaml
    "requests-mock",
    "mypy",
    "pre-commit>=4",
    "copier>=9.16.0", # used by the create-converter scaffolding CLI (scripts/)
]

[tool.ruff]
src = ["src", "tests"]
line-length = 120
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP006"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "assets"]

[tool.hatch.build.targets.wheel]
packages = ["src/evo"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Literal TOML strings (single quotes) need no escaping of backslashes.
# Converts relative links to absolute links in PyPI
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/SeequentEvo/evo-data-converters/tree/main/packages/common/\g<2>)'
