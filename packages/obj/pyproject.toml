[project]
name = "evo-data-converters-obj"
description = "Python data converters for Wavefront Technologies OBJ/MTL file to Evo geoscience objects"
version = "0.2.0"
# Using python 3.14 causes error "Timeout should be used inside a task" - this will be fixed later
requires-python = ">=3.10,<3.13"
license-files = ["LICENSE.md"]
dynamic = ["readme"]
authors = [
    { name = "Seequent", email = "support@seequent.com" }
]
dependencies = [
    "evo-data-converters-common",
    "trimesh>=4.9.0",
]

[dependency-groups]
dev = [
    "pandas",
    "pytest",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
"notebooks" = [
    "evo-sdk-common[notebooks]",
    "notebook>=7.4.3",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/evo"]

# This is only needed for the tinyobjloader github ref above. Once a stable release exists this can go.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Literal TOML strings (single quotes) need no escaping of backslashes.
# Converts relative links to absolute links in PyPI
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/SeequentEvo/evo-data-converters/tree/main/packages/obj/\g<2>)'

[tool.uv.sources]
evo-data-converters-common = { path = "../common", editable = true }
tinyobjloader = { git = "https://github.com/tinyobjloader/tinyobjloader.git" }
